spring.application.name=ejsecurity

# application.properties

# Clave secreta para firmar el JWT (mínimo 256 bits = 32 caracteres)
# En producción usá una variable de entorno, NUNCA hardcodes!
app.security.jwt.secret=WFzEDM1eIQJZjJ8yfMLHeC1ozmdgForWbiczNxnUUX0=

# Tiempo de expiración en milisegundos (86400000 = 24 horas)
app.security.jwt.expiration=86400000

#configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/gamer?useSSL=false&server

spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect